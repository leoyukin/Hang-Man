<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Hangman</title>
</head>

<body>

    <h1>Hangman</h1>

    <!-- Lives Remaining-->
    <p id="lives">Lives: 6</p>

    <!--Display Word-->
    <div id="word-display"></div>

    <!--Keyboard Layout-->
    <div id="keyboard"></div>

    <!--Win/lose Message -->
    <p id="message"></p>

    <!--The Word Was-->
    <p id="word-is"></p>

    <!--New Attempt or Word-->
    <button id="restart">New Word</button>

    <script src="script.js"></script>
</body>

</html>
